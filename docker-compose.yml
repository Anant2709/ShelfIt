services:
  api:
    build:
      context: ./backend
      args:
        INSTALL_ML: "false"
    ports:
      - "8000:8000"
    environment:
      # Container-local paths; the host bind mount below keeps data across runs.
      DATABASE_URL: sqlite:////data/shelfit.db
      UPLOAD_DIR: /data/uploads
      SHELF_LIFE_PATH: /data/shelf_life.json
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      SHELF_LIFE_API_KEY: ${SHELF_LIFE_API_KEY:-}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8000/api
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
